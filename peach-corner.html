<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cành đào và cỏ cây</title>
<style>
  /* ===== Nền demo (khi nhúng vào trang khác thì bỏ phần này) ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #fff7ef 0%, #fbe9e1 55%, #eef3df 100%);
    font-family: Georgia, "Noto Serif JP", serif;
    color: #7a5a48;
  }
  .demo-title { text-align: center; letter-spacing: .25em; font-size: clamp(16px, 2.4vw, 24px); }

  /* ===== LỚP TRANG TRÍ (copy từ đây trở xuống) ===== */
  .deco {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }

  /* ---------- Cành đào (góc trên bên phải) ---------- */
  .branch-svg {
    position: absolute; right: 0; top: 0;
    width: clamp(250px, 42vw, 520px);
    height: auto;
    transform-origin: 100% 0;
    animation: gust 13s ease-in-out -3s infinite;
  }
  .branch { transform-origin: 435px 0px; transform-box: view-box; animation: branchSway 7s ease-in-out infinite alternate; }
  .twig   { transform-box: view-box; animation: twigSway 4.6s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  .bl     { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  .lf     { transform-box: fill-box; transform-origin: 0% 50%; animation: leafWave 3.8s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  .wood   { fill: none; stroke: #5a3826; stroke-linecap: round; }
  .wood-hi{ fill: none; stroke: #8a5f42; stroke-linecap: round; opacity: .55; }

  @keyframes branchSway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.9deg); } }
  @keyframes twigSway   { from { transform: rotate(-2.6deg); } to { transform: rotate(3.2deg); } }
  @keyframes flutter    { from { transform: rotate(-7deg) scale(1); } to { transform: rotate(9deg) scale(1.05); } }
  @keyframes leafWave   { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }

  /* Cơn gió mạnh thỉnh thoảng thổi qua */
  @keyframes gust {
    0%, 60%, 100% { transform: rotate(0deg); }
    70%           { transform: rotate(1.5deg); }
    80%           { transform: rotate(-.6deg); }
    90%           { transform: rotate(.5deg); }
  }

  /* ---------- Cỏ cây (góc dưới bên trái) ---------- */
  .grass-svg {
    position: absolute; left: 0; bottom: 0;
    width: clamp(230px, 36vw, 470px);
    height: auto;
    transform-origin: 0 100%;
    animation: gustGrass 11s ease-in-out infinite;
  }
  .blade  { transform-box: view-box; animation: bladeSway ease-in-out infinite alternate; }
  .lf2    { transform-box: fill-box; transform-origin: 50% 100%; animation: bigLeaf ease-in-out infinite alternate; }
  .flower { transform-box: view-box; animation: flowerSway ease-in-out infinite alternate; }

  @keyframes bladeSway  { from { transform: rotate(calc(var(--amp) * -1)); } to { transform: rotate(var(--amp)); } }
  @keyframes bigLeaf    { from { transform: rotate(-3deg); } to { transform: rotate(3.5deg); } }
  @keyframes flowerSway { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
  @keyframes gustGrass {
    0%, 58%, 100% { transform: skewX(0deg); }
    68%           { transform: skewX(-3deg); }
    78%           { transform: skewX(1deg); }
    88%           { transform: skewX(-1deg); }
  }

  /* ---------- Cánh hoa rơi ---------- */
  .petals { position: absolute; inset: 0; overflow: hidden; }
  .petal  { position: absolute; top: -24px; display: block; animation: fall linear infinite; will-change: transform; }
  .petal b {
    display: block; width: 100%; height: 100%;
    background: radial-gradient(circle at 30% 30%, #ffe6ee, #f48fb1);
    border-radius: 80% 0 80% 0;
    opacity: .85;
    animation: petalFlip 2.6s ease-in-out infinite alternate;
  }
  @keyframes fall {
    from { transform: translate3d(0, -6vh, 0) rotate(0deg); }
    to   { transform: translate3d(var(--drift), 108vh, 0) rotate(var(--rot)); }
  }
  @keyframes petalFlip {
    from { transform: rotateX(0deg) rotateY(0deg) translateX(-6px); }
    to   { transform: rotateX(70deg) rotateY(40deg) translateX(8px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .deco *, .deco { animation: none !important; }
  }
</style>
</head>
<body>

<p class="demo-title">春 · XUÂN VỀ</p>

<div class="deco" aria-hidden="true">

  <!-- ================= CÀNH ĐÀO ================= -->
  <svg class="branch-svg" viewBox="0 0 430 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="pg" cx="50%" cy="88%" r="85%">
        <stop offset="0"  stop-color="#ec5f8f"/>
        <stop offset=".5" stop-color="#ffb3c8"/>
        <stop offset="1"  stop-color="#ffe6ee"/>
      </radialGradient>
      <ellipse id="petal" cx="0" cy="-9" rx="6.6" ry="9.6" fill="url(#pg)" stroke="#f48fb1" stroke-width=".5"/>
      <g id="blossom">
        <use href="#petal"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
        <circle r="2.8" fill="#f9a825"/>
        <circle cx="0" cy="-5.2" r="1" fill="#c2185b" transform="rotate(36)"/>
        <circle cx="0" cy="-5.2" r="1" fill="#c2185b" transform="rotate(108)"/>
        <circle cx="0" cy="-5.2" r="1" fill="#c2185b" transform="rotate(180)"/>
        <circle cx="0" cy="-5.2" r="1" fill="#c2185b" transform="rotate(252)"/>
        <circle cx="0" cy="-5.2" r="1" fill="#c2185b" transform="rotate(324)"/>
      </g>
      <g id="bud">
        <circle r="3.6" fill="#ec6f9a"/>
        <circle cx="-1" cy="-1.2" r="1.3" fill="#ffc2d6"/>
      </g>
      <path id="leaf" d="M0 0 C 6 -6 17 -6 24 0 C 17 6 6 6 0 0Z" fill="#8fc16a"/>
    </defs>

    <g class="branch">
      <!-- thân cành chính -->
      <path class="wood"    d="M435 2 C 360 30, 300 55, 240 95 S 120 165, 36 190" stroke-width="10"/>
      <path class="wood-hi" d="M435 -1 C 360 27, 300 52, 240 92 S 120 162, 36 187" stroke-width="2.5"/>
      <circle cx="331" cy="44" r="4" fill="#4a2f20"/>
      <circle cx="240" cy="95" r="4.5" fill="#4a2f20"/>
      <circle cx="147" cy="148" r="4" fill="#4a2f20"/>

      <!-- hoa trên thân chính -->
      <g transform="translate(195 123) scale(.9) rotate(-12)"><g class="bl" style="--d:-.2s"><use href="#blossom"/></g></g>
      <g transform="translate(205 136) scale(.7) rotate(20)"><g class="bl" style="--d:-1.3s"><use href="#blossom"/></g></g>

      <!-- cành nhánh 1 -->
      <g class="twig" style="transform-origin:331px 44px; --d:-.5s">
        <path class="wood" d="M331 44 C 326 70, 332 92, 318 122" stroke-width="4"/>
        <g transform="translate(331 56) rotate(40)"><g class="lf" style="--d:-.8s"><use href="#leaf"/></g></g>
        <g transform="translate(338 88)"><use href="#bud"/></g>
        <g transform="translate(330 70) scale(.8) rotate(10)"><g class="bl" style="--d:-.6s"><use href="#blossom"/></g></g>
        <g transform="translate(322 100) scale(.95) rotate(-20)"><g class="bl" style="--d:-1.7s"><use href="#blossom"/></g></g>
        <g transform="translate(318 124) scale(1.1) rotate(30)"><g class="bl" style="--d:-2.4s"><use href="#blossom"/></g></g>
      </g>

      <!-- cành nhánh 2 -->
      <g class="twig" style="transform-origin:240px 95px; --d:-1.8s">
        <path class="wood" d="M240 95 C 236 122, 244 146, 230 176" stroke-width="4"/>
        <g transform="translate(240 108) rotate(30)"><g class="lf" style="--d:-.3s"><use href="#leaf"/></g></g>
        <g transform="translate(250 138)"><use href="#bud"/></g>
        <g transform="translate(240 122) scale(.85) rotate(5)"><g class="bl" style="--d:-.9s"><use href="#blossom"/></g></g>
        <g transform="translate(234 150) scale(1) rotate(-25)"><g class="bl" style="--d:-2.1s"><use href="#blossom"/></g></g>
        <g transform="translate(230 178) scale(1.1) rotate(40)"><g class="bl" style="--d:-.1s"><use href="#blossom"/></g></g>
      </g>

      <!-- cành nhánh 3 -->
      <g class="twig" style="transform-origin:147px 148px; --d:-2.6s">
        <path class="wood" d="M147 148 C 142 172, 150 190, 138 218" stroke-width="4"/>
        <g transform="translate(147 160) rotate(20)"><g class="lf" style="--d:-1.1s"><use href="#leaf"/></g></g>
        <g transform="translate(154 186)"><use href="#bud"/></g>
        <g transform="translate(146 172) scale(.9) rotate(12)"><g class="bl" style="--d:-1.5s"><use href="#blossom"/></g></g>
        <g transform="translate(142 198) scale(1) rotate(-10)"><g class="bl" style="--d:-.4s"><use href="#blossom"/></g></g>
        <g transform="translate(138 220) scale(1.1) rotate(35)"><g class="bl" style="--d:-2.8s"><use href="#blossom"/></g></g>
      </g>

      <!-- cành nhánh 4 (hướng lên) -->
      <g class="twig" style="transform-origin:285px 68px; --d:-1.2s">
        <path class="wood" d="M285 68 C 270 52, 250 44, 226 46" stroke-width="3.2"/>
        <g transform="translate(275 60) rotate(200)"><g class="lf" style="--d:-.7s"><use href="#leaf"/></g></g>
        <g transform="translate(258 42)"><use href="#bud"/></g>
        <g transform="translate(268 52) scale(.9)"><g class="bl" style="--d:-1.9s"><use href="#blossom"/></g></g>
        <g transform="translate(248 46) scale(1) rotate(25)"><g class="bl" style="--d:-.5s"><use href="#blossom"/></g></g>
        <g transform="translate(228 48) scale(1.15) rotate(-15)"><g class="bl" style="--d:-2.3s"><use href="#blossom"/></g></g>
      </g>

      <!-- cành nhánh 5 (ngắn, trên cùng) -->
      <g class="twig" style="transform-origin:379px 24px; --d:-3s">
        <path class="wood" d="M379 24 C 372 12, 362 6, 348 4" stroke-width="3"/>
        <g transform="translate(374 18)"><use href="#bud"/></g>
        <g transform="translate(366 10) scale(.85)"><g class="bl" style="--d:-.6s"><use href="#blossom"/></g></g>
        <g transform="translate(350 6) scale(1) rotate(20)"><g class="bl" style="--d:-1.4s"><use href="#blossom"/></g></g>
      </g>

      <!-- cành nhánh 6 (gần ngọn) -->
      <g class="twig" style="transform-origin:95px 170px; --d:-.9s">
        <path class="wood" d="M95 170 C 90 150, 78 138, 60 134" stroke-width="3"/>
        <g transform="translate(96 152)"><use href="#bud"/></g>
        <g transform="translate(86 150) scale(.85) rotate(5)"><g class="bl" style="--d:-1s"><use href="#blossom"/></g></g>
        <g transform="translate(70 138) scale(1) rotate(-30)"><g class="bl" style="--d:-2s"><use href="#blossom"/></g></g>
        <g transform="translate(58 134) scale(1.1) rotate(15)"><g class="bl" style="--d:-.3s"><use href="#blossom"/></g></g>
      </g>

      <!-- ngọn cành -->
      <g class="twig" style="transform-origin:95px 170px; --d:-2.2s">
        <g transform="translate(100 176) rotate(150)"><g class="lf" style="--d:-.2s"><use href="#leaf"/></g></g>
        <g transform="translate(62 186)"><use href="#bud"/></g>
        <g transform="translate(70 178) scale(.9) rotate(8)"><g class="bl" style="--d:-1.2s"><use href="#blossom"/></g></g>
        <g transform="translate(52 184) scale(1) rotate(-20)"><g class="bl" style="--d:-2.6s"><use href="#blossom"/></g></g>
        <g transform="translate(36 190) scale(1.2) rotate(30)"><g class="bl" style="--d:-.8s"><use href="#blossom"/></g></g>
      </g>
    </g>
  </svg>

  <!-- ================= CỎ CÂY (JS vẽ bên dưới) ================= -->
  <svg class="grass-svg" id="grass" viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- ================= CÁNH HOA RƠI ================= -->
  <div class="petals" id="petals"></div>
</div>

<script>
(function () {
  /* ---------- Cỏ cây ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('grass');
  const H = 240;
  let seed = 7;                                       // random cố định để bố cục không đổi mỗi lần tải
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const el = (name, attrs, parent) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  };

  function blades(count, palette, hMul, ampMul) {
    const g = el('g', {});
    for (let i = 0; i < count; i++) {
      const x = Math.pow(rnd(), 1.35) * 410 + 6;      // dày hơn ở sát góc
      const h = (50 + rnd() * 115) * hMul * (1 - x / 560);
      const bend = (rnd() - .35) * 38 + 6;            // hơi ngả về bên phải
      const w = 2.2 + rnd() * 2.2;
      const d = `M${x - w} ${H} Q${x + bend * .3} ${H - h * .55} ${x + bend} ${H - h} ` +
                `Q${x + bend * .3 + w} ${H - h * .55} ${x + w} ${H} Z`;
      const p = el('path', { d, fill: palette[(rnd() * palette.length) | 0], class: 'blade' }, g);
      p.style.transformOrigin = `${x}px ${H}px`;
      p.style.setProperty('--amp', (1.2 + (h / 32) * ampMul).toFixed(2) + 'deg');
      p.style.animationDuration = (3 + rnd() * 3.2).toFixed(2) + 's';
      p.style.animationDelay = (-rnd() * 6).toFixed(2) + 's';
    }
  }

  function broadLeaves(x, count, scale, palette) {
    const g = el('g', {});
    for (let i = 0; i < count; i++) {
      const angle = -55 + i * (110 / (count - 1)) + (rnd() - .5) * 8;
      const outer = el('g', { transform: `translate(${x} ${H}) rotate(${angle.toFixed(1)}) scale(${scale})` }, g);
      const inner = el('g', { class: 'lf2' }, outer);
      el('path', { d: 'M0 0 C 11 -20, 11 -52, 0 -80 C -11 -52, -11 -20, 0 0Z', fill: palette[i % palette.length] }, inner);
      el('path', { d: 'M0 -2 L0 -70', stroke: 'rgba(255,255,255,.3)', 'stroke-width': '1.2', fill: 'none' }, inner);
      inner.style.animationDuration = (3.6 + rnd() * 2.4).toFixed(2) + 's';
      inner.style.animationDelay = (-rnd() * 5).toFixed(2) + 's';
    }
  }

  function wildflowers(positions) {
    const colors = ['#ffffff', '#ffd1e0', '#fff3b0', '#ffb3c8'];
    positions.forEach((x, i) => {
      const h = 70 + rnd() * 50 - x / 12;
      const dx = (rnd() - .3) * 26;
      const tx = x + dx, ty = H - h;
      const g = el('g', { class: 'flower' });
      el('path', { d: `M${x} ${H} Q${x + dx * .2} ${H - h * .5} ${tx} ${ty}`, stroke: '#4d8a3f', 'stroke-width': '1.8', fill: 'none', 'stroke-linecap': 'round' }, g);
      const color = colors[i % colors.length];
      for (let k = 0; k < 5; k++) {
        const a = (k * 72 - 90) * Math.PI / 180;
        el('circle', { cx: (tx + Math.cos(a) * 4.6).toFixed(2), cy: (ty + Math.sin(a) * 4.6).toFixed(2), r: 3.6, fill: color, stroke: 'rgba(0,0,0,.08)', 'stroke-width': '.5' }, g);
      }
      el('circle', { cx: tx, cy: ty, r: 2.6, fill: '#f4b400' }, g);
      g.style.transformOrigin = `${x}px ${H}px`;
      g.style.animationDuration = (3.4 + rnd() * 2.2).toFixed(2) + 's';
      g.style.animationDelay = (-rnd() * 5).toFixed(2) + 's';
    });
  }

  blades(38, ['#2f6b3a', '#3a7a40', '#2c5f35'], 1.0, 1.0);                   // lớp cỏ sau (tối)
  broadLeaves(34, 5, 1.05, ['#3f8a45', '#4a9a4e', '#35773c']);               // bụi lá lớn
  broadLeaves(112, 4, .75, ['#4a9a4e', '#5aa95a', '#3f8a45']);
  blades(48, ['#4f9a45', '#6bb04f', '#86c25a', '#5a9e49'], .85, 1.2);        // lớp cỏ trước (sáng)
  wildflowers([58, 96, 150, 205, 258, 312, 360]);                            // hoa dại

  /* ---------- Cánh hoa rơi ---------- */
  const box = document.getElementById('petals');
  for (let i = 0; i < 12; i++) {
    const size = 8 + Math.random() * 8;
    const p = document.createElement('i');
    p.className = 'petal';
    p.style.left = (50 + Math.random() * 48) + 'vw';          // rơi từ phía cành đào
    p.style.width = size + 'px';
    p.style.height = (size * 1.35) + 'px';
    p.style.setProperty('--drift', (-(10 + Math.random() * 30)) + 'vw');
    p.style.setProperty('--rot', (360 + Math.random() * 540) + 'deg');
    p.style.animationDuration = (9 + Math.random() * 8).toFixed(1) + 's';
    p.style.animationDelay = (-Math.random() * 14).toFixed(1) + 's';
    p.appendChild(document.createElement('b'));
    box.appendChild(p);
  }
})();
</script>
</body>
</html>
